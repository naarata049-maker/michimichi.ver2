name: 読みがなの表を作る
on:
  push:
    paths: ['tools/build_kana.py', '.github/workflows/kana.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_kana.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add kana
          git diff --cached --quiet || git commit -m "読みがなの表を更新"
          git push
