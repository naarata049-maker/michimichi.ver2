<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#d3e8e0">
<title>みちみち</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* プロトタイプ２（W-2 全面ドット青・V-5 ドットの文字盤）をそのまま画面に。6pxごとに4pxの点 */
:root{
  --gap:#d3e8e0; --dot:#b2dfd9;
  --dial-gap:#ede9df; --dial-dot:#e7e2d6;
  --tick:#f3ae69; --needle:#ff0000; --tail:#c8c2b4;
  --ink:#2e2c28; --sub:#8a857a; --pill:#ede9df; --pill-line:#cfc7b6;
  --orange:#e2a32e;
  --font:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  color-scheme:light;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--gap);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.pill{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);left:max(24px,env(safe-area-inset-left,0px));padding:8px 15px;font-size:13px;background:var(--pill);border:1px solid var(--pill-line);border-radius:18px}
.dist{position:fixed;left:0;right:0;text-align:center;font-size:44px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.walk{position:fixed;left:0;right:0;text-align:center;font-size:14px;color:var(--sub)}
.bottom{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 42px);display:flex;flex-direction:column;align-items:center;gap:14px;padding-inline:24px}
button{font-family:var(--font);color:var(--ink);cursor:pointer}
.start{width:100%;max-width:345px;height:54px;font-size:17px;background:var(--orange);border:0;border-radius:27px}
.start:focus-visible,.link:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.link{background:none;border:0;font-size:13px;color:var(--sub);text-decoration:underline;text-underline-offset:3px;padding:6px}
.note{font-size:13px;color:var(--sub);text-align:center;line-height:1.6;max-width:320px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="pill" id="ticket">片道券 No.0000</div>
<div class="dist" id="dist">約 – km</div>
<div class="walk" id="walk">徒歩 約–分</div>
<div class="bottom">
  <p class="note" id="note" hidden></p>
  <button class="start" id="start" type="button">歩き始める</button>
  <button class="link" id="reroll" type="button" hidden>行き先を変える（試し用）</button>
</div>
<script>
(()=>{
const P=6, D=4;                 // 点の間隔と大きさ（Figmaと同じ）
const R=22.4;                   // 文字盤の半径（点の数）
const cv=document.getElementById('c'), cx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C={gap:css('--gap'),dot:css('--dot'),dg:css('--dial-gap'),dd:css('--dial-dot'),tick:css('--tick'),needle:css('--needle'),tail:css('--tail'),ink:css('--ink')};

let W=0,H=0,dpr=1,gx=0,gy=0,bg=null;
function layout(){
  dpr=Math.min(window.devicePixelRatio||1,3);
  W=innerWidth; H=innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
  gx=Math.floor(W/2/P); gy=Math.round(H*0.48/P);   // 文字盤の中心（点の位置）
  const y=gy*P;
  $('dist').style.top=(y+174)+'px';
  $('walk').style.top=(y+256)+'px';
  bg=document.createElement('canvas'); bg.width=W*dpr; bg.height=H*dpr;
  const b=bg.getContext('2d'); b.setTransform(dpr,0,0,dpr,0,0);
  b.fillStyle=C.gap; b.fillRect(0,0,W,H);
  for(let j=0;j*P<H;j++)for(let i=0;i*P<W;i++){
    const r=Math.hypot(i-gx,j-gy);
    if(r<=R){b.fillStyle=C.dg;b.fillRect(i*P,j*P,P,P);b.fillStyle=C.dd;}else b.fillStyle=C.dot;
    b.fillRect(i*P+1,j*P+1,D,D);
  }
  // 目盛り：12本、上下左右は少し長く
  b.fillStyle=C.tick;
  for(let k=0;k<12;k++){
    const a=k*Math.PI/6, len=k%3===0?3:2;
    for(let s=0;s<len;s++){
      const rr=R-1.6-s, i=Math.round(gx+Math.sin(a)*rr), j=Math.round(gy-Math.cos(a)*rr);
      b.fillRect(i*P+1,j*P+1,D,D);
    }
  }
  // ▲ 自分の向き（真上で固定）
  b.fillStyle=C.ink;
  const ty=gy-Math.ceil(R)-2;
  b.fillRect(gx*P+1,(ty)*P+1,D,D);
  for(let d=-1;d<=1;d++)b.fillRect((gx+d)*P+1,(ty+1)*P+1,D,D);
}

// 針：前（赤）と後ろ（灰）を点で塗る
function inTri(x,y,ax,ay,bx,by,qx,qy){
  const s=(p,q,r,t,u,v)=>(p-u)*(t-v)-(r-u)*(q-v);
  const d1=s(x,y,ax,ay,bx,by),d2=s(x,y,bx,by,qx,qy),d3=s(x,y,qx,qy,ax,ay);
  return !((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0));
}
function draw(angle){
  cx.drawImage(bg,0,0,W,H);
  const sn=Math.sin(angle), cs=Math.cos(angle);
  for(let j=-12;j<=12;j++)for(let i=-12;i<=12;i++){
    // 画面の点を針の向きに戻して判定（yは上が前）
    const x=i*cs+j*sn, y=-(-i*sn+j*cs);
    let col=null;
    if(inTri(x,y,-2.6,0.2,2.6,0.2,0,9.5))col=C.needle;
    else if(inTri(x,y,-2,0.2,2,0.2,0,-8))col=C.tail;
    if(col){cx.fillStyle=col;cx.fillRect((gx+i)*P+1,(gy+j)*P+1,D,D);}
  }
}

// ---- 位置と方角 ----
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let dest=store.get('mm-dest');       // {lat,lng,no}
let pos=null, heading=null, started=false;
let shown=0;                          // 画面に出ている針の角度
const rad=d=>d*Math.PI/180;

function pickDest(p){
  // 試し用：今いる場所から1.2〜1.8km先のどこか
  const dist=1200+Math.random()*600, br=Math.random()*2*Math.PI, Re=6371000;
  const la=rad(p.lat), lo=rad(p.lng), dr=dist/Re;
  const la2=Math.asin(Math.sin(la)*Math.cos(dr)+Math.cos(la)*Math.sin(dr)*Math.cos(br));
  const lo2=lo+Math.atan2(Math.sin(br)*Math.sin(dr)*Math.cos(la),Math.cos(dr)-Math.sin(la)*Math.sin(la2));
  dest={lat:la2*180/Math.PI,lng:lo2*180/Math.PI,no:String(Math.floor(Math.random()*9000)+1000).padStart(4,'0')};
  store.set('mm-dest',dest);
}
function distBear(a,b){
  const R0=6371000, f1=rad(a.lat), f2=rad(b.lat), df=f2-f1, dl=rad(b.lng-a.lng);
  const h=Math.sin(df/2)**2+Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)**2;
  const d=2*R0*Math.asin(Math.sqrt(h));
  const y=Math.sin(dl)*Math.cos(f2), x=Math.cos(f1)*Math.sin(f2)-Math.sin(f1)*Math.cos(f2)*Math.cos(dl);
  return {d, b:(Math.atan2(y,x)*180/Math.PI+360)%360};
}
function fmt(d){
  if(d>=1000)return '約 '+(d/1000).toFixed(1)+' km';
  if(d>=100)return '約 '+Math.round(d/50)*50+' m';
  return '約 '+Math.max(10,Math.round(d/10)*10)+' m';
}
function showText(){
  $('ticket').textContent='片道券 No.'+(dest?dest.no:'0000');
  if(!pos||!dest)return;
  const {d}=distBear(pos,dest);
  if(d<30){$('dist').textContent='着きました';$('walk').textContent='このあたりを歩いてみてください';return;}
  $('dist').textContent=fmt(d);
  $('walk').textContent='徒歩 約'+Math.max(1,Math.ceil(d/80))+'分';
}
function note(t){const n=$('note');n.textContent=t||'';n.hidden=!t;}

function onOri(e){
  let h=null;
  if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;          // iPhone
  else if(e.absolute&&typeof e.alpha==='number')h=360-e.alpha;                      // Android
  if(h==null)return;
  const so=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
  heading=(h+so+360)%360;
}

async function start(){
  $('start').disabled=true;
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r!=='granted')note('方角を使う許可が出ませんでした。設定から許可して、もう一度ひらいてください。');
    }
  }catch(e){}
  if('ondeviceorientationabsolute' in window)addEventListener('deviceorientationabsolute',onOri);
  else addEventListener('deviceorientation',onOri);
  if(!navigator.geolocation){note('この端末では位置がわかりません。');return;}
  note('位置をさがしています…');
  navigator.geolocation.watchPosition(p=>{
    pos={lat:p.coords.latitude,lng:p.coords.longitude};
    if(!dest)pickDest(pos);
    if(heading==null)note('方角がまだわかりません。端末を8の字に動かしてみてください。');else note('');
    showText();
  },err=>{
    note(err.code===1?'位置を使う許可が出ませんでした。設定から許可して、もう一度ひらいてください。':'位置がうまく取れません。空の見える場所で待ってみてください。');
  },{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
  started=true;
  $('start').hidden=true; $('reroll').hidden=false;
  try{await navigator.wakeLock.request('screen')}catch(e){}
}
$('start').addEventListener('click',start);
$('reroll').addEventListener('click',()=>{if(pos){pickDest(pos);showText();}});

function tick(){
  let target=0;
  if(started&&pos&&dest&&heading!=null){
    target=rad(distBear(pos,dest).b-heading);
    if(heading!=null&&$('note').textContent.startsWith('方角'))note('');
  }
  let d=target-shown; d=Math.atan2(Math.sin(d),Math.cos(d));
  shown+=d*0.15;
  draw(shown);
  requestAnimationFrame(tick);
}
addEventListener('resize',layout);
document.fonts&&document.fonts.ready.then(showText);
layout(); showText(); tick();
})();
</script>
</body>
</html>
